<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>家具生産管理</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#fff;color:#111}.app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:78px}.head{position:sticky;top:0;background:#fff;border-bottom:1px solid #eee;padding:16px;z-index:2}h1{font-size:26px;margin:0;font-weight:800}h2{font-size:21px;margin:0}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.week{display:grid;grid-template-columns:50px repeat(5,1fr) 50px 42px;gap:6px;margin-top:14px}.week button,.blueBtn,.whiteBtn{border-radius:10px;border:1px solid #ddd;background:#fff;padding:10px 6px;font-weight:800}.week .active,.blueBtn{background:#0b65e5;color:white;border-color:#0b65e5}.week small{display:block;font-size:11px}.content{padding:16px}.card{border:1px solid #e6e6e6;border-radius:12px;margin:10px 0;background:#fff;overflow:hidden}.item{display:grid;grid-template-columns:38px 1fr 70px 22px;gap:8px;align-items:center;padding:17px 12px;border-bottom:1px solid #eee}.item:last-child{border-bottom:0}.check{width:27px;height:27px;border:2px solid #222;border-radius:5px;display:grid;place-items:center;font-weight:900}.check.done{background:#34b957;color:#fff;border-color:#34b957}.check.mid{background:#f6c343;border-color:#f6c343;color:#111}.link{border:0;background:transparent;color:#0b65e5;font-size:19px;font-weight:800;text-align:left;padding:0}.qty{text-align:right;font-size:18px;font-weight:800}.chev{font-size:24px;color:#0b65e5}.tabs{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:auto;height:72px;background:#fff;border-top:1px solid #ddd;display:grid;grid-template-columns:1fr 1fr}.tabs button{border:0;background:#fff;font-weight:800;color:#555}.tabs .active{color:#0b65e5;border-top:3px solid #0b65e5}.back{border:0;background:#fff;font-size:30px}.panel{border:1px solid #e6e6e6;border-radius:12px;padding:14px;margin:12px 0}.process{font-size:18px;font-weight:900;border-bottom:2px solid #0b65e5;padding-bottom:6px;margin-top:20px}.task{display:grid;grid-template-columns:30px 1fr;gap:8px;padding:12px 0;border-bottom:1px solid #f0f0f0}.task input[type=checkbox]{width:22px;height:22px}.memo{width:100%;margin-top:7px;border:1px solid #ddd;border-radius:8px;padding:9px;min-height:40px}.field{width:100%;border:1px solid #ddd;border-radius:9px;padding:13px;margin:8px 0 14px;font-size:16px}textarea.field{min-height:170px}.menu{width:100%;border:1px solid #e5e5e5;background:#fff;border-radius:12px;padding:18px;text-align:left;font-size:18px;font-weight:900;margin:10px 0;display:flex;justify-content:space-between}.toggle{display:flex;gap:10px;align-items:center;padding:14px 0;border-bottom:1px solid #eee;font-weight:800}.toggle input{width:22px;height:22px}.small{color:#666;font-size:13px}.danger{color:#d33;border-color:#d33}.memoIcon{color:#d33}.calGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}.calCell{border:1px solid #e1e1e1;background:#fff;border-radius:10px;min-height:46px;font-weight:800}.calCell.active{background:#0b65e5;color:#fff}.calCell.muted{color:#bbb}.calDow{text-align:center;font-size:13px;font-weight:800;color:#666}.editRow{display:grid;grid-template-columns:1fr 76px 58px;gap:8px;align-items:center;padding:12px 0;border-bottom:1px solid #eee}.bulkDelete{width:100%;margin:10px 0 4px;padding:12px;border-radius:10px;border:1px solid #d33;background:#fff;color:#d33;font-weight:900}
.countBox{text-align:center}.bigCount{font-size:32px;font-weight:900}.countBtns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}.countBtns button{font-size:28px;border-radius:12px;padding:12px}.countBtns button:disabled{background:#eee;color:#aaa;border-color:#ddd}.remain{font-weight:900;font-size:18px}.pinDots{height:50px;line-height:50px;box-sizing:border-box;font-size:22px;letter-spacing:22px;text-align:center;margin:10px auto 22px;border:1px solid #ddd;border-radius:10px;max-width:310px;padding:0;color:#666;overflow:hidden}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:275px;margin:18px auto 0}.keypad button{height:50px;border-radius:8px;border:1px solid #ddd;background:#fff;font-size:21px;font-weight:900;color:#0b65e5}.keypad .ok{background:#0b65e5;color:#fff}.keypad .clear{color:#0b65e5}.err{color:#d33;text-align:center;font-weight:800;min-height:20px}</style>
</head>
<body>
<div id="app"></div>
<script type="module">
const firebaseConfig={apiKey:"AIzaSyDuF1ZbPdwFDsD6eMdjwYpdzQUIACc6KCQ",authDomain:"furniture-production-manager.firebaseapp.com",projectId:"furniture-production-manager",storageBucket:"furniture-production-manager.firebasestorage.app",messagingSenderId:"836063100556",appId:"1:836063100556:web:7089a7b0e1da382c1805a9"};
const ADMIN_PASSWORD="1234";
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getFirestore,collection,doc,setDoc,deleteDoc,onSnapshot}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
let db=null,ready=false;try{db=getFirestore(initializeApp(firebaseConfig));ready=true}catch(e){console.warn(e)}
const DEFAULT=["木取り","加工","サンディング","塗装","オイル","組立て","検品","梱包"];
let S={screen:"production",date:ymd(new Date()),calMonth:new Date(),item:null,processId:null,items:[],processes:[],pin:"",pinErr:""};
if(ready){
 onSnapshot(collection(db,"processMaster"),async snap=>{S.processes=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.order||0)-(b.order||0));if(!S.processes.length){for(const[i,n]of DEFAULT.entries())await setDoc(doc(db,"processMaster",uid()),{name:n,order:i,tasks:[]});return}render()});
 onSnapshot(collection(db,"productionItems"),snap=>{S.items=snap.docs.map(d=>normalizeItem({id:d.id,...d.data()}));render()});
}else{S.items=JSON.parse(localStorage.fp_items||"[]").map(normalizeItem);S.processes=JSON.parse(localStorage.fp_processes||"null")||DEFAULT.map((name,i)=>({id:uid(),name,order:i,tasks:[]}));saveLocal();render()}
function normalizeItem(x){x.qty=Number(x.qty||0);x.completedQty=Number(x.completedQty||0);if(x.completedQty<0)x.completedQty=0;if(x.completedQty>x.qty)x.completedQty=x.qty;return x}
function saveLocal(){localStorage.fp_items=JSON.stringify(S.items);localStorage.fp_processes=JSON.stringify(S.processes)}
async function saveItem(x){normalizeItem(x);calc(x);if(ready)await setDoc(doc(db,"productionItems",x.id),x);else{let i=S.items.findIndex(a=>a.id===x.id);if(i>=0)S.items[i]=x;else S.items.push(x);saveLocal();render()}}
async function delItem(id){if(ready)await deleteDoc(doc(db,"productionItems",id));else{S.items=S.items.filter(x=>x.id!==id);saveLocal();render()}}
async function saveProcess(p){if(ready)await setDoc(doc(db,"processMaster",p.id),p);else{let i=S.processes.findIndex(x=>x.id===p.id);if(i>=0)S.processes[i]=p;else S.processes.push(p);syncAll();saveLocal();render()}}
function render(){({production,calendar,detail,setting,login,admin,paste,productionEdit,processAdmin,taskAdmin}[S.screen]||production)()}
function layout(html,tab="production"){app.innerHTML=`<div class="app">${html}<div class="tabs"><button id="tProd" class="${tab==="production"?"active":""}">☷<br>生産</button><button id="tAdm" class="${tab==="admin"?"active":""}">⚙<br>管理</button></div></div>`;tProd.onclick=()=>{S.screen="production";render()};tAdm.onclick=()=>{S.pin="";S.pinErr="";S.screen="login";render()}}
function statusMark(x){if(x.completedQty>=x.qty&&x.qty>0)return{c:"done",t:"✓"};if(x.completedQty>0)return{c:"mid",t:"△"};return{c:"",t:""}}
function production(){let week=getWeek(S.date),list=S.items.filter(x=>x.date===S.date).sort(byOrder);layout(`<div class="head"><h1>家具生産管理</h1><div class="week"><button id="prev">前週</button>${week.map(d=>`<button data-d="${ymd(d)}" class="${ymd(d)===S.date?"active":""}">${d.getMonth()+1}/${d.getDate()}<small>${"日月火水木金土"[d.getDay()]}</small></button>`).join("")}<button id="next">次週</button><button id="cal">📅</button></div></div><div class="content"><h2>${jpdate(S.date)} の生産リスト</h2><div class="card">${list.length?list.map(x=>{let st=statusMark(x);return`<div class="item"><div class="check ${st.c}">${st.t}</div><button class="link" data-open="${x.id}">${esc(x.name)} ${x.hasMemo?'<span class="memoIcon">📝</span>':""}</button><div class="qty">${x.completedQty}/${x.qty}台</div><div class="chev">›</div></div>`}).join(""):`<div class="panel small">この日の生産リストはありません。</div>`}</div></div>`);prev.onclick=()=>move(-7);next.onclick=()=>move(7);cal.onclick=()=>{S.calMonth=new Date(S.date+"T00:00:00");S.screen="calendar";render()};document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{S.date=b.dataset.d;render()});document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{S.item=S.items.find(x=>x.id===b.dataset.open);ensure(S.item);S.screen="detail";render()})}
function calendar(){let y=S.calMonth.getFullYear(),m=S.calMonth.getMonth(),first=new Date(y,m,1),start=new Date(first);start.setDate(1-first.getDay());let days=[...Array(42)].map((_,i)=>{let d=new Date(start);d.setDate(start.getDate()+i);return d});layout(`<div class="head"><div class="row"><button class="back" id="back">‹</button><h2>日付を選択</h2><span></span></div></div><div class="content"><div class="row"><button class="whiteBtn" id="pm">＜</button><h2>${y}年${m+1}月</h2><button class="whiteBtn" id="nm">＞</button></div><div class="calGrid">${["日","月","火","水","木","金","土"].map(x=>`<div class="calDow">${x}</div>`).join("")}${days.map(d=>`<button class="calCell ${d.getMonth()!==m?"muted":""} ${ymd(d)===S.date?"active":""}" data-cal="${ymd(d)}">${d.getDate()}</button>`).join("")}</div><button class="blueBtn" id="today" style="width:100%;margin-top:14px">今日に戻る</button></div>`);back.onclick=()=>{S.screen="production";render()};pm.onclick=()=>{S.calMonth=new Date(y,m-1,1);render()};nm.onclick=()=>{S.calMonth=new Date(y,m+1,1);render()};today.onclick=()=>{S.date=ymd(new Date());S.screen="production";render()};document.querySelectorAll("[data-cal]").forEach(b=>b.onclick=()=>{S.date=b.dataset.cal;S.screen="production";render()})}
function detail(){let x=S.item;ensure(x);let remain=Math.max(0,x.qty-x.completedQty);layout(`<div class="head"><div class="row"><button class="back" id="back">‹</button><h2>${esc(x.name)}</h2><button class="whiteBtn" id="set">⚙ 工程設定</button></div></div><div class="content"><div class="panel countBox"><div>予定数 ${x.qty}台</div><div class="bigCount">${x.completedQty} / ${x.qty}台</div><div class="remain">残数 ${remain}台</div><div class="countBtns"><button id="minus" ${x.completedQty<=0?"disabled":""}>−</button><button id="plus" ${x.completedQty>=x.qty?"disabled":""}>＋</button></div></div>${x.enabled.map(p=>{let tasks=x.processes[p]?.tasks||[];return`<div class="process">${esc(p)}</div>${tasks.length?tasks.map((t,i)=>`<div class="task"><input type="checkbox" data-c="${p}" data-i="${i}" ${t.done?"checked":""}><div><b>${esc(t.name)}</b><textarea class="memo" placeholder="メモ：" data-m="${p}" data-i="${i}">${esc(t.memo||"")}</textarea></div></div>`).join(""):`<div class="panel small">小工程が未登録です。管理 ＞ 工程管理で追加してください。</div>`}`}).join("")}</div>`);back.onclick=()=>{S.screen="production";render()};set.onclick=()=>{S.screen="setting";render()};minus.onclick=async()=>{if(x.completedQty>0){x.completedQty--;await saveItem(x)}};plus.onclick=async()=>{if(x.completedQty<x.qty){x.completedQty++;await saveItem(x)}};document.querySelectorAll("[data-c]").forEach(e=>e.onchange=async()=>{let p=e.dataset.c,i=+e.dataset.i;x.processes[p].tasks[i].done=e.checked;calc(x);await saveItem(x)});document.querySelectorAll("[data-m]").forEach(e=>e.onchange=async()=>{let p=e.dataset.m,i=+e.dataset.i;x.processes[p].tasks[i].memo=e.value;calc(x);await saveItem(x)})}
function setting(){let x=S.item;ensure(x);layout(`<div class="head"><div class="row"><button class="back" id="back">‹</button><h2>工程設定</h2><span></span></div></div><div class="content">${S.processes.map(p=>`<label class="toggle"><input type="checkbox" data-p="${esc(p.name)}" ${x.enabled.includes(p.name)?"checked":""}>${esc(p.name)}</label>`).join("")}<button class="blueBtn" id="saveBtn">保存</button></div>`);back.onclick=()=>{S.screen="detail";render()};saveBtn.onclick=async()=>{x.enabled=[...document.querySelectorAll("[data-p]")].filter(e=>e.checked).map(e=>e.dataset.p);ensure(x);calc(x);await saveItem(x);S.screen="detail";render()}}
function login(){layout(`<div class="content" style="padding-top:42px"><div style="text-align:center"><h1 style="font-size:24px">管理ログイン</h1><p class="small" style="font-size:15px;margin-top:18px">4桁のパスワードを入力してください</p></div><div class="pinDots">${"●".repeat(S.pin.length)}</div><div class="err">${S.pinErr}</div><div class="keypad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-num="${n}">${n}</button>`).join("")}<button class="clear" id="clear">×</button><button data-num="0">0</button><button class="ok" id="ok">OK</button></div></div>`,"admin");document.querySelectorAll("[data-num]").forEach(b=>b.onclick=()=>{if(S.pin.length<4){S.pin+=b.dataset.num;S.pinErr="";render()}});clear.onclick=()=>{S.pin=S.pin.slice(0,-1);S.pinErr="";render()};ok.onclick=()=>{if(S.pin===ADMIN_PASSWORD){S.pin="";S.pinErr="";S.screen="admin";render()}else{S.pin="";S.pinErr="パスワードが違います";render()}}}
function admin(){layout(`<div class="head"><h1>管理メニュー</h1></div><div class="content"><button class="menu" id="pasteBtn">日報貼り付け <span>›</span></button><button class="menu" id="editBtn">生産追加・編集 <span>›</span></button><button class="menu" id="procBtn">工程管理 <span>›</span></button></div>`,"admin");pasteBtn.onclick=()=>{S.screen="paste";render()};editBtn.onclick=()=>{S.screen="productionEdit";render()};procBtn.onclick=()=>{S.screen="processAdmin";render()}}
function paste(){layout(`<div class="head"><div class="row"><button class="back" id="back">‹</button><h2>日報貼り付け</h2><span></span></div></div><div class="content"><b>生産日</b><input id="pdate" class="field" type="date" value="${S.date}"><b>アイテム・数量</b><textarea id="txt" class="field" placeholder="テーブルA 5&#10;チェアB 20&#10;TVボードA 3"></textarea><button class="blueBtn" id="reg">登録</button><div class="panel small">登録先の日付：<b id="pasteTarget">${S.date}</b></div></div>`,"admin");back.onclick=()=>{S.screen="admin";render()};pdate.onchange=()=>{pasteTarget.textContent=dateValue(pdate)};reg.onclick=async()=>{let targetDate=dateValue(pdate);if(!targetDate)return alert("生産日を選択してください");let rows=parse(txt.value);if(!rows.length)return alert("登録できる行がありません");let base=Date.now();for(const [i,r] of rows.entries())await saveItem(newItem(targetDate,r.name,r.qty,base+i));S.date=targetDate;S.screen="production";render()}}
function productionEdit(){let list=S.items.filter(x=>x.date===S.date).sort(byOrder);layout(`<div class="head"><div class="row"><button class="back" id="back">‹</button><h2>生産追加・編集</h2><span></span></div></div><div class="content"><b>生産日</b><input id="edate" class="field" type="date" value="${S.date}"><div class="panel small">編集対象の日付：<b id="editTarget">${S.date}</b></div><div class="panel">${list.length?`<button class="bulkDelete" id="bulkDel">この日の生産を一括削除</button>`:""}${list.length?list.map(x=>`<div class="editRow"><b>${esc(x.name)}</b><input class="field" style="margin:0" type="number" value="${x.qty}" data-qty="${x.id}"><button class="whiteBtn danger" data-del="${x.id}">削除</button></div>`).join(""):`<div class="small">この日の生産はありません。</div>`}</div><h2>新規追加</h2><input id="newName" class="field" placeholder="アイテム名"><input id="newQty" class="field" type="number" placeholder="数量"><button class="blueBtn" id="addNew" style="width:100%">追加</button></div>`,"admin");back.onclick=()=>{S.screen="admin";render()};edate.onchange=()=>{S.date=dateValue(edate);render()};if(window.bulkDel){bulkDel.onclick=async()=>{if(confirm(`${S.date} の生産をすべて削除しますか？`)){for(const x of list)await delItem(x.id)}}}document.querySelectorAll("[data-qty]").forEach(e=>e.onchange=async()=>{let x=S.items.find(i=>i.id===e.dataset.qty);x.qty=Number(e.value||0);if(x.completedQty>x.qty)x.completedQty=x.qty;await saveItem(x)});document.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{if(confirm("この生産を削除しますか？"))await delItem(b.dataset.del)});addNew.onclick=async()=>{if(!newName.value||!newQty.value)return alert("アイテム名と数量を入力してください");await saveItem(newItem(S.date,newName.value,Number(newQty.value),nextOrder(S.date)));render()}}
function processAdmin(){layout(`<div class="head"><div class="row"><button class="back" id="back">‹</button><h2>工程管理</h2><button class="whiteBtn" id="add">＋大工程</button></div></div><div class="content">${S.processes.map(p=>`<button class="menu" data-proc="${p.id}">${esc(p.name)} <span>${(p.tasks||[]).length}件 ›</span></button>`).join("")}</div>`,"admin");back.onclick=()=>{S.screen="admin";render()};add.onclick=async()=>{let n=prompt("大工程名");if(n)await saveProcess({id:uid(),name:n,order:S.processes.length,tasks:[]})};document.querySelectorAll("[data-proc]").forEach(b=>b.onclick=()=>{S.processId=b.dataset.proc;S.screen="taskAdmin";render()})}
function taskAdmin(){let p=S.processes.find(x=>x.id===S.processId);layout(`<div class="head"><div class="row"><button class="back" id="back">‹</button><h2>${esc(p.name)}</h2><span></span></div></div><div class="content">${(p.tasks||[]).length?p.tasks.map((t,i)=>`<div class="panel row"><b>${esc(t)}</b><span><button class="whiteBtn" data-e="${i}">編集</button> <button class="whiteBtn danger" data-del="${i}">削除</button></span></div>`).join(""):`<div class="panel small">小工程はまだありません。</div>`}<button class="blueBtn" id="addTask">＋小工程追加</button></div>`,"admin");back.onclick=()=>{S.screen="processAdmin";render()};addTask.onclick=async()=>{let n=prompt("小工程名");if(n){p.tasks=p.tasks||[];p.tasks.push(n);await saveProcess(p);await syncAll()}};document.querySelectorAll("[data-e]").forEach(b=>b.onclick=async()=>{let i=+b.dataset.e,n=prompt("小工程名",p.tasks[i]);if(n){p.tasks[i]=n;await saveProcess(p);await syncAll()}});document.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{let i=+b.dataset.del;if(confirm("削除しますか？")){p.tasks.splice(i,1);await saveProcess(p);await syncAll()}})}
function newItem(date,name,qty,order){let x={id:uid(),date,name,qty:Number(qty),order:order??Date.now(),completedQty:0,completed:false,hasMemo:false,enabled:S.processes.map(p=>p.name),processes:{}};ensure(x);return x}
function ensure(x){if(!x)return;normalizeItem(x);if(!x.processes)x.processes={};if(!x.enabled)x.enabled=S.processes.map(p=>p.name);S.processes.forEach(p=>{let old=x.processes[p.name]?.tasks||[],map=Object.fromEntries(old.map(t=>[t.name,t]));x.processes[p.name]={tasks:(p.tasks||[]).map(n=>map[n]||{name:n,done:false,memo:""})}})}
async function syncAll(){for(const x of S.items){ensure(x);calc(x);await saveItem(x)}}
function calc(x){let tasks=x.enabled.flatMap(p=>x.processes[p]?.tasks||[]);x.hasMemo=tasks.some(t=>(t.memo||"").trim());x.completed=x.qty>0&&x.completedQty>=x.qty}
function parse(text){return text.split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{let m=l.match(/^(.+?)[\s,、\t]+(\d+)$/);return m?{name:m[1].trim(),qty:+m[2]}:null}).filter(Boolean)}
function byOrder(a,b){return (a.order??0)-(b.order??0)}
function nextOrder(date){let list=S.items.filter(x=>x.date===date);return list.length?Math.max(...list.map(x=>x.order??0))+1:Date.now()}
function dateValue(el){return (el && el.value ? el.value : S.date).replaceAll("/","-")}
function getWeek(s){let d=new Date(s+"T00:00:00"),m=new Date(d);m.setDate(d.getDate()-((d.getDay()+6)%7));return[0,1,2,3,4].map(i=>{let x=new Date(m);x.setDate(m.getDate()+i);return x})}
function move(n){let d=new Date(S.date+"T00:00:00");d.setDate(d.getDate()+n);S.date=ymd(d);render()}
function ymd(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function jpdate(s){let d=new Date(s+"T00:00:00");return`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${"日月火水木金土"[d.getDay()]}）`}
function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now()+Math.random().toString(16).slice(2)}
function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
</script>
</body>
</html>
